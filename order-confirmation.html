<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation — ShopFlow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238b5cf6'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header rendered by app.js -->

  <main class="main-content">
    <div class="confirmation-page">
      <div class="confirmation-icon">
        <i class="fas fa-check"></i>
      </div>
      <h2>Thank You for Your Order!</h2>
      <p class="subtitle">Your order has been placed successfully and is currently being processed.</p>
      
      <div class="confirmation-order-id" id="order-id-display">
        <!-- Rendered via JS -->
      </div>
      
      <div class="confirmation-details">
        <h3 style="color: white; margin-bottom: 15px; font-size: 16px;">Order Details</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 13px;">
          <div>
            <div style="color: var(--text-secondary); margin-bottom: 5px;">Shipping To:</div>
            <div style="color: white;" id="confirm-name"></div>
            <div style="color: white; margin-top: 5px;" id="confirm-address"></div>
          </div>
          <div>
            <div style="color: var(--text-secondary); margin-bottom: 5px;">Contact Info:</div>
            <div style="color: white;" id="confirm-email"></div>
            <div style="color: white; margin-top: 5px;" id="confirm-phone"></div>
          </div>
        </div>
        
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 13px;">
          <div style="color: var(--text-secondary); margin-bottom: 5px;">Payment Status:</div>
          <div style="color: var(--color-warning); font-weight: 600;"><i class="fas fa-clock"></i> Pending Verification</div>
          <p style="color: var(--text-muted); font-size: 11px; margin-top: 5px;">We are verifying your payment screenshot. You will receive an update once it's confirmed.</p>
        </div>
      </div>
      
      <div class="confirmation-actions">
        <button class="btn-primary" onclick="window.location.href='products.html'">Continue Shopping</button>
        <button class="btn-secondary" onclick="window.location.href='orders.html'">View My Orders</button>
      </div>
    </div>
  </main>

  <!-- Footer rendered by app.js -->

  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader();
      renderFooter();
      
      const orderId = getUrlParam('id');
      if (!orderId) {
        window.location.href = 'index.html';
        return;
      }
      
      // Show loading
      document.getElementById('order-id-display').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
      
      const order = await Orders.getById(orderId);
      if (!order) {
        document.querySelector('.confirmation-page').innerHTML = `
          <h2>Order Not Found</h2>
          <p>We couldn't find the details for this order.</p>
          <button class="btn-primary" onclick="window.location.href='index.html'" style="margin-top:20px;">Return Home</button>
        `;
        return;
      }
      
      const ship = order.shippingInfo || {};
      document.getElementById('order-id-display').textContent = order.id;
      document.getElementById('confirm-name').textContent = `${ship.firstName || ''} ${ship.lastName || ''}`.trim() || 'N/A';
      document.getElementById('confirm-address').textContent = ship.address || 'N/A';
      document.getElementById('confirm-email').textContent = order.customerEmail || 'N/A';
      document.getElementById('confirm-phone').textContent = ship.phone || 'N/A';
    });
  </script>
</body>
</html>
