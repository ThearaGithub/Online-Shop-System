<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — ShopFlow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238b5cf6'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header rendered by app.js -->

  <main class="main-content">
    <div class="page-title-bar">
      <div class="breadcrumb" id="detail-breadcrumb">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Main Detail Section -->
    <section class="product-detail-section" id="detail-container">
      <!-- Loading state -->
      <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
        <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--accent-purple);"></i>
      </div>
    </section>

    <!-- Full Specifications -->
    <section class="specs-section" id="specs-container" style="display: none;">
      <h3 class="specs-title">Full Specifications</h3>
      <div id="specs-content">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Related Products -->
    <section class="products-section" id="related-container" style="display: none;">
      <div class="section-header">
        <div class="section-title">You May Also Like</div>
      </div>
      <div class="products-grid" id="related-products-grid">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Reviews Section -->
    <section class="reviews-section" id="reviews-container" style="display: none;">
      <h3 class="specs-title">Customer Reviews</h3>
      <div id="reviews-content">
        <!-- Rendered via JS -->
      </div>
    </section>

  </main>

  <!-- Footer rendered by app.js -->

  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
