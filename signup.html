<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ShopFlow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238b5cf6'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header rendered by app.js -->

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-image">
        <img src="assets/Login Signup Banner.png" alt="Join ShopFlow" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <div class="auth-form">
        <h2>Create an Account</h2>
        <p class="auth-subtitle">Already have an account? <a href="login.html">Log in</a></p>
        
        <form id="signup-form">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" class="form-input" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
            </div>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            <div class="form-error" id="email-error"></div>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
              <span class="password-toggle" onclick="togglePassword('password', this)">
                <i class="far fa-eye"></i>
              </span>
            </div>
            <div class="form-error" id="password-error"></div>
          </div>
          
          <div class="checkbox-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
          </div>
          
          <div class="form-error" id="signup-error" style="margin-bottom: 15px; font-weight: 600; text-align: center;"></div>
          
          <button type="submit" class="btn-submit" id="signup-btn">Create Account</button>
        </form>
        
        <div class="auth-footer-links">
          <a href="contact.html">Need Help?</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
